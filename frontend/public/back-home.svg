<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="400" fill="#273B73"></rect>

  <!-- Wave shape left -->
  <path d="M0,300 C150,250 250,350 400,300 C550,250 650,300 800,280 L800,400 L0,400 Z" fill="#1F2F5F" opacity="0.9"></path>

  <!-- Dots pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.25"></circle>
    </pattern>
  </defs>

  <rect x="40" y="40" width="180" height="120" fill="url(#dots)"></rect>

  <!-- Decorative lines -->
  <line x1="950" y1="250" x2="1000" y2="230" stroke="#ffffff" stroke-width="2" opacity="0.6"></line>
  <line x1="960" y1="265" x2="1010" y2="245" stroke="#ffffff" stroke-width="2" opacity="0.4"></line>

  <!-- Circle image -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="950" cy="150" r="70"></circle>
    </clipPath>
  </defs>

  <circle cx="950" cy="150" r="74" fill="#ffffff"></circle>

  <image href="team.webp" x="880" y="80" width="140" height="140" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"></image>

</svg>
